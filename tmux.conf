unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g base-index 1
set -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

set -g status-style 'bg=terminal'
set -g status-left ""
set -g status-justify "left"
set -g status-right ""

set -wg automatic-rename on
set -g automatic-rename-format ''
set -g window-status-separator '|'
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_flags ""
set -g @catppuccin_window_number ""
# set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I #{#{s|$HOME|~|:#{pane_current_path}}} "
# set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I#{?#{!=:#{window_name},Window},: #W,} "
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_mantle}] #I. #{?#{!=:#{window_name},},#{window_name},#{s|^$HOME|~|:#{pane_current_path}}} "

set -g @catppuccin_window_current_number ""
# set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I #{#{s|$HOME|~|:#{pane_current_path}}} "
# set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},Window},: #W,} "
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I. #{?#{!=:#{window_name},},#{window_name},#{s|^$HOME|~|:#{pane_current_path}}} "

run '~/.tmux/plugins/tpm/tpm'
